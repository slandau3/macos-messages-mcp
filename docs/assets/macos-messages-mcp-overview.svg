<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
  <title id="title">How the macOS Messages MCP works</title>
  <desc id="desc">A simple flow from a question in ChatGPT or Codex through a local read-only app to Messages history on the Mac, with an answer returned.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef2ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b" />
    </marker>
    <marker id="return-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4f46e5" />
    </marker>
    <style>
      .background { fill: url(#background); }
      .eyebrow { fill: #4f46e5; font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .title { fill: #0f172a; font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #475569; font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .box-accent-purple { fill: #eef2ff; stroke: #818cf8; }
      .box-accent-blue { fill: #eff6ff; stroke: #60a5fa; }
      .box-accent-green { fill: #ecfdf5; stroke: #34d399; }
      .box-accent-orange { fill: #fff7ed; stroke: #fb923c; }
      .heading { fill: #0f172a; font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334155; font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #64748b; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .return-arrow { fill: none; stroke: #4f46e5; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#return-arrow); }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .pill-text { fill: #334155; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; }
        .title, .heading { fill: #f8fafc; }
        .subtitle, .body, .small, .pill-text { fill: #cbd5e1; }
        .box { fill: #1e293b; stroke: #475569; }
        .box-accent-purple { fill: #1e1b4b; stroke: #818cf8; }
        .box-accent-blue { fill: #172554; stroke: #60a5fa; }
        .box-accent-green { fill: #022c22; stroke: #34d399; }
        .box-accent-orange { fill: #431407; stroke: #fb923c; }
        .pill { fill: #1e293b; stroke: #475569; }
      }
    </style>
  </defs>

  <rect class="background" width="1400" height="610" rx="28" />
  <text class="eyebrow" x="70" y="62">A SIMPLE, LOCAL CONNECTION</text>
  <text class="title" x="70" y="108">Ask about your own Messages history</text>
  <text class="subtitle" x="70" y="143">The assistant asks. A small app reads. A useful answer comes back.</text>

  <g filter="url(#shadow)">
    <rect class="box box-accent-purple" x="70" y="225" width="270" height="155" rx="20" />
    <text class="heading" x="100" y="270">You</text>
    <text class="body" x="100" y="310">“Find my latest</text>
    <text class="body" x="100" y="337">message about the trip.”</text>

    <rect class="box box-accent-blue" x="410" y="225" width="270" height="155" rx="20" />
    <text class="heading" x="440" y="270">ChatGPT / Codex</text>
    <text class="body" x="440" y="310">Asks the local</text>
    <text class="body" x="440" y="337">connector for context</text>

    <rect class="box box-accent-green" x="750" y="225" width="270" height="155" rx="20" />
    <text class="heading" x="780" y="270">Local read-only app</text>
    <text class="body" x="780" y="310">Runs only when needed</text>
    <text class="body" x="780" y="337">No menu-bar app or daemon</text>

    <rect class="box box-accent-orange" x="1090" y="225" width="240" height="155" rx="20" />
    <text class="heading" x="1120" y="270">Your Mac</text>
    <text class="body" x="1120" y="310">Messages history</text>
    <text class="body" x="1120" y="337">stays here</text>
  </g>

  <line class="arrow" x1="350" y1="302" x2="395" y2="302" />
  <line class="arrow" x1="690" y1="302" x2="735" y2="302" />
  <line class="arrow" x1="1030" y1="302" x2="1075" y2="302" />

  <path class="return-arrow" d="M1210 410 C1210 505 190 505 190 410" />
  <text class="small" x="560" y="480">Helpful answer returns to you</text>

  <rect class="pill" x="380" y="540" width="180" height="40" rx="20" />
  <text class="pill-text" x="421" y="566">Local</text>
  <rect class="pill" x="610" y="540" width="180" height="40" rx="20" />
  <text class="pill-text" x="651" y="566">Read-only</text>
  <rect class="pill" x="840" y="540" width="180" height="40" rx="20" />
  <text class="pill-text" x="875" y="566">On demand</text>
</svg>
