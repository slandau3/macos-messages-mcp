<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Privacy promises of the macOS Messages MCP</title>
  <desc id="desc">Three cards show that the connection stays local, is read-only, and runs only when needed.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4" />
      <stop offset="1" stop-color="#eff6ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.11" />
    </filter>
    <style>
      .background { fill: url(#background); }
      .eyebrow { fill: #059669; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .title { fill: #0f172a; font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { fill: #ffffff; stroke: #dbeafe; stroke-width: 2; }
      .heading { fill: #0f172a; font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #475569; font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .icon-local { fill: #ecfdf5; stroke: #10b981; }
      .icon-read { fill: #eff6ff; stroke: #3b82f6; }
      .icon-time { fill: #eef2ff; stroke: #6366f1; }
      .line { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; }
        .title, .heading { fill: #f8fafc; }
        .body { fill: #cbd5e1; }
        .card { fill: #1e293b; stroke: #475569; }
        .icon-local { fill: #022c22; }
        .icon-read { fill: #172554; }
        .icon-time { fill: #1e1b4b; }
      }
    </style>
  </defs>

  <rect class="background" width="1200" height="390" rx="28" />
  <text class="eyebrow" x="60" y="54">DESIGNED FOR PEACE OF MIND</text>
  <text class="title" x="60" y="96">Small permissions. Clear boundaries.</text>

  <g filter="url(#shadow)">
    <rect class="card" x="60" y="135" width="340" height="205" rx="20" />
    <circle class="icon-local" cx="111" cy="187" r="27" stroke-width="2" />
    <path d="M111 166 L128 173 V186 C128 198 121 205 111 210 C101 205 94 198 94 186 V173 Z" class="line" stroke="#059669" />
    <path d="M102 187 L108 193 L120 180" class="line" stroke="#059669" />
    <text class="heading" x="155" y="195">Stays local</text>
    <text class="body" x="92" y="242">Your messages stay on your</text>
    <text class="body" x="92" y="269">Mac while this connector is</text>
    <text class="body" x="92" y="296">doing its job.</text>

    <rect class="card" x="430" y="135" width="340" height="205" rx="20" />
    <circle class="icon-read" cx="481" cy="187" r="27" stroke-width="2" />
    <path d="M462 187 C470 172 492 172 500 187 C492 202 470 202 462 187 Z" class="line" stroke="#2563eb" />
    <circle cx="481" cy="187" r="6" fill="none" stroke="#2563eb" stroke-width="4" />
    <path d="M464 207 L498 167" class="line" stroke="#2563eb" />
    <text class="heading" x="525" y="195">Read-only</text>
    <text class="body" x="462" y="242">It can find and inspect</text>
    <text class="body" x="462" y="269">messages, but it cannot send,</text>
    <text class="body" x="462" y="296">edit, or delete anything.</text>

    <rect class="card" x="800" y="135" width="340" height="205" rx="20" />
    <circle class="icon-time" cx="851" cy="187" r="27" stroke-width="2" />
    <circle cx="851" cy="187" r="15" fill="none" stroke="#4f46e5" stroke-width="4" />
    <path d="M851 177 V188 L859 193" class="line" stroke="#4f46e5" />
    <text class="heading" x="895" y="195">On demand</text>
    <text class="body" x="832" y="242">It starts when your assistant</text>
    <text class="body" x="832" y="269">needs context and exits when</text>
    <text class="body" x="832" y="296">the conversation is done.</text>
  </g>
</svg>
