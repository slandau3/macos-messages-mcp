<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Three steps to set up the macOS Messages MCP</title>
  <desc id="desc">A three-step setup flow: build the app, allow macOS access, and connect ChatGPT or Codex.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed" />
      <stop offset="1" stop-color="#f5f3ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.11" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8" />
    </marker>
    <style>
      .background { fill: url(#background); }
      .eyebrow { fill: #c2410c; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .title { fill: #0f172a; font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
      .number { fill: #ffffff; font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .heading { fill: #0f172a; font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #475569; font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #94a3b8; stroke-width: 3; marker-end: url(#arrow); }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111827; }
        .title, .heading { fill: #f8fafc; }
        .body { fill: #cbd5e1; }
        .card { fill: #1e293b; stroke: #475569; }
      }
    </style>
  </defs>

  <rect class="background" width="1200" height="390" rx="28" />
  <text class="eyebrow" x="60" y="54">GET STARTED WITHOUT THE FUSS</text>
  <text class="title" x="60" y="96">Three simple steps</text>

  <g filter="url(#shadow)">
    <rect class="card" x="60" y="145" width="315" height="180" rx="20" />
    <circle cx="103" cy="188" r="24" fill="#f97316" />
    <text class="number" x="103" y="196">1</text>
    <text class="heading" x="145" y="196">Build</text>
    <text class="body" x="92" y="242">Create the small local app</text>
    <text class="body" x="92" y="269">that connects your assistant</text>
    <text class="body" x="92" y="296">to your Messages history.</text>

    <rect class="card" x="442" y="145" width="315" height="180" rx="20" />
    <circle cx="485" cy="188" r="24" fill="#eab308" />
    <text class="number" x="485" y="196">2</text>
    <text class="heading" x="527" y="196">Allow</text>
    <text class="body" x="474" y="242">Give macOS permission to</text>
    <text class="body" x="474" y="269">this app only when it asks.</text>
    <text class="body" x="474" y="296">Nothing else needs access.</text>

    <rect class="card" x="824" y="145" width="315" height="180" rx="20" />
    <circle cx="867" cy="188" r="24" fill="#8b5cf6" />
    <text class="number" x="867" y="196">3</text>
    <text class="heading" x="909" y="196">Connect</text>
    <text class="body" x="856" y="242">Add it to ChatGPT or Codex,</text>
    <text class="body" x="856" y="269">then ask your first question.</text>
    <text class="body" x="856" y="296">That is it.</text>
  </g>

  <line class="arrow" x1="390" y1="235" x2="425" y2="235" />
  <line class="arrow" x1="772" y1="235" x2="807" y2="235" />
</svg>
